<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Messenger - UI reference</title>
<link rel="stylesheet" href="./tabler-icons.min.css">
<style>
/* DESIGN TOKENS: the single source of truth. Implement the real app with these exact values. */
:root{
  --bg:#F4F3FB;--pn:#FFFFFF;--tx:#1E1B3A;--tx2:#6B6892;--bd:#E4E2F3;
  --ac:#6C5CE7;--ac2:#EDEAFD;--in:#F0EEFA;--rc:#FFFFFF;--rt:#1E1B3A;--pg:#E4E2F3;
  --online:#1D9E75;--c-laptop:#1D9E75;--c-phone:#D85A30;--c-desktop:#378ADD;--c-file:#D4537E;--badge:#D4537E;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  --bg:#12111C;--pn:#1B1A29;--tx:#F1EFFF;--tx2:#9C99BD;--bd:#2A2840;
  --ac:#8B7DFF;--ac2:#2A2650;--in:#242238;--rc:#242238;--rt:#F1EFFF;--pg:#2A2840;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;display:flex;align-items:center;justify-content:center;padding:16px}
p{margin:0}
.app{width:100%;max-width:980px;height:min(640px,calc(100vh - 32px));background:var(--bg);border:.5px solid var(--bd);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:230px minmax(0,1fr);position:relative}
.side{background:var(--pn);border-right:.5px solid var(--bd);display:flex;flex-direction:column}
.me{padding:14px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.av.me-av{background:var(--ac);border-radius:50%;font-size:13px;font-weight:500}
.name{font-size:14px;font-weight:500}
.sub{font-size:12px;color:var(--tx2)}
.grow{flex:1;min-width:0}
#tg{width:34px;height:34px;padding:0;border-radius:50%;border:.5px solid var(--bd);background:var(--in);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.nearby{padding:4px 14px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx2)}
.list{padding:0 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--in)}
.row.active{background:var(--ac2)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--badge);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.settings{margin-top:auto;padding:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer}
.main{display:flex;flex-direction:column;min-width:0}
.head{padding:12px 18px;background:var(--pn);border-bottom:.5px solid var(--bd);display:flex;align-items:center;gap:10px}
.head .name{font-size:15px}
.online{font-size:12px;color:var(--online)}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.who{font-size:12px;color:var(--tx2);margin-bottom:3px}
.in-b{align-self:flex-start;max-width:75%}
.in-b .who{margin-left:4px}
.out-b{align-self:flex-end;max-width:75%}
.out-b .who{margin-right:4px;text-align:right}
.bub-in{background:var(--rc);color:var(--rt);border:.5px solid var(--bd);padding:9px 14px;border-radius:4px 16px 16px 16px;line-height:1.5;word-break:break-word}
.bub-out{background:var(--ac);color:#fff;padding:9px 14px;border-radius:16px 4px 16px 16px;line-height:1.5;word-break:break-word}
.status{font-size:11px;color:var(--tx2);margin:3px 4px 0 0;text-align:right}
.file{align-self:flex-end;width:80%;background:var(--pn);border:.5px solid var(--bd);border-radius:16px;padding:12px}
.file-top{display:flex;align-items:center;gap:10px}
.file .av{background:var(--c-file)}
.bar{margin-top:10px;height:8px;border-radius:4px;background:var(--pg);overflow:hidden}
.bar>div{width:64%;height:100%;background:var(--online);border-radius:4px;transition:width 0.2s ease}
.compose{padding:12px 14px;background:var(--pn);border-top:.5px solid var(--bd);display:flex;align-items:center;gap:10px}
.compose input{flex:1;background:var(--in);color:var(--tx);border:0;border-radius:20px;padding:9px 16px;font:inherit;outline:none}
.compose input::placeholder{color:var(--tx2)}
.send{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.ico{font-size:18px;color:var(--tx2)}

/* Settings Modal using exact design tokens */
.modal-backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.35);z-index:99;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal-box{background:var(--pn);border:.5px solid var(--bd);border-radius:16px;width:340px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.modal-input{width:100%;background:var(--in);color:var(--tx);border:.5px solid var(--bd);border-radius:12px;padding:8px 12px;font:inherit;outline:none}
.modal-btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:8px 18px;font:inherit;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="me">
      <div class="av me-av" id="my-avatar">SF</div>
      <div class="grow"><p class="name" id="my-alias">Swift Falcon</p><p class="sub">This device</p></div>
      <button id="tg" aria-label="Switch theme"><i class="ti ti-moon" id="ti" style="font-size:18px" aria-hidden="true"></i></button>
    </div>
    <div class="nearby"><span id="nearby-label">Nearby, 0 online</span><i class="ti ti-radar-2" style="font-size:16px;color:var(--online)" aria-label="Scanning"></i></div>
    <div class="list" id="peer-list">
      <!-- Peer items rendered dynamically -->
    </div>
    <div class="settings" id="btn-settings"><i class="ti ti-settings" style="font-size:16px" aria-hidden="true"></i>Settings</div>
  </aside>

  <section class="main">
    <div class="head">
      <div class="av" id="chat-av" style="background:var(--c-laptop)"><i class="ti ti-device-laptop" id="chat-icon" style="font-size:20px" aria-hidden="true"></i></div>
      <div class="grow"><p class="name" id="chat-peer-name">Select a device</p><p class="online" id="chat-peer-status">Online on this Wi-Fi</p></div>
      <i class="ti ti-search ico" aria-label="Search chat"></i>
    </div>

    <div class="msgs" id="msg-container">
      <!-- Chat bubbles and file cards rendered dynamically -->
    </div>

    <div class="compose">
      <i class="ti ti-paperclip ico" id="btn-attach" style="font-size:20px;cursor:pointer" aria-label="Attach file"></i>
      <input type="text" id="compose-input" placeholder="Select a device to message...">
      <button class="send" id="btn-send" aria-label="Send"><i class="ti ti-send" style="font-size:18px" aria-hidden="true"></i></button>
    </div>
  </section>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="modal-settings">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="name" style="font-size:15px">Settings</span>
        <i class="ti ti-x ico" id="close-settings" style="cursor:pointer;font-size:18px"></i>
      </div>
      <div>
        <p class="sub" style="margin-bottom:6px">Device Friendly Alias</p>
        <input class="modal-input" id="setting-alias-input" type="text" maxlength="32">
      </div>
      <div>
        <p class="sub" style="margin-bottom:4px">Device ID</p>
        <p class="sub" id="setting-device-id" style="font-size:11px;word-break:break-all"></p>
      </div>
      <div>
        <p class="sub" style="margin-bottom:4px">Network Port</p>
        <p class="sub" id="setting-port" style="font-size:12px"></p>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
        <button class="modal-btn" id="btn-save-settings">Save</button>
      </div>
    </div>
  </div>

</div>
<script>
// Theme handling
var root=document.documentElement,btn=document.getElementById('tg'),ic=document.getElementById('ti');
var saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
var t=saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function apply(v){root.setAttribute('data-theme',v);ic.className=v==='dark'?'ti ti-sun':'ti ti-moon';try{localStorage.setItem('theme',v)}catch(e){}}
apply(t);
btn.addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark')});

// DOM Elements
var peerListEl = document.getElementById('peer-list');
var nearbyLabelEl = document.getElementById('nearby-label');
var chatAvEl = document.getElementById('chat-av');
var chatIconEl = document.getElementById('chat-icon');
var chatPeerNameEl = document.getElementById('chat-peer-name');
var chatPeerStatusEl = document.getElementById('chat-peer-status');
var msgContainerEl = document.getElementById('msg-container');
var composeInput = document.getElementById('compose-input');
var btnSend = document.getElementById('btn-send');
var btnAttach = document.getElementById('btn-attach');

var settingsModal = document.getElementById('modal-settings');
var btnSettings = document.getElementById('btn-settings');
var closeSettings = document.getElementById('close-settings');
var btnSaveSettings = document.getElementById('btn-save-settings');
var aliasInput = document.getElementById('setting-alias-input');
var deviceIdEl = document.getElementById('setting-device-id');
var portEl = document.getElementById('setting-port');

// State
var mySettings = null;
var peersMap = {}; // device_id -> peer
var unreadCounts = {}; // device_id -> count
var activePeerId = null;
var activeTransfers = {}; // transfer_id -> info

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  var k = 1024;
  var sizes = ['B', 'KB', 'MB', 'GB'];
  var i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1).replace(/\.0$/, '') + ' ' + sizes[i];
}

function getFileIcon(name) {
  var ext = (name || '').split('.').pop().toLowerCase();
  if (['mp4', 'mkv', 'avi', 'mov', 'webm'].indexOf(ext) !== -1) return 'ti ti-movie';
  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].indexOf(ext) !== -1) return 'ti ti-photo';
  if (['mp3', 'wav', 'flac', 'aac', 'ogg'].indexOf(ext) !== -1) return 'ti ti-music';
  if (['zip', 'rar', '7z', 'tar', 'gz'].indexOf(ext) !== -1) return 'ti ti-file-zip';
  return 'ti ti-file';
}

function updateMyDeviceUI(info) {
  if (!info) return;
  mySettings = info;
  var nameEl = document.getElementById('my-alias');
  var avEl = document.getElementById('my-avatar');
  if (nameEl && info.alias) nameEl.textContent = info.alias;
  if (avEl && info.alias) {
    var initials = info.alias.split(' ').map(function(s){return s[0];}).join('').slice(0, 2).toUpperCase();
    avEl.textContent = initials;
  }
}

function getDeviceStyle(type) {
  if (type === 'mobile' || type === 'phone') {
    return { bg: 'var(--c-phone)', icon: 'ti ti-device-mobile', label: 'Phone' };
  } else if (type === 'desktop') {
    return { bg: 'var(--c-desktop)', icon: 'ti ti-device-desktop', label: 'Desktop' };
  } else {
    return { bg: 'var(--c-laptop)', icon: 'ti ti-device-laptop', label: 'Laptop' };
  }
}

function renderPeerList() {
  var peerList = Object.values(peersMap);
  nearbyLabelEl.textContent = 'Nearby, ' + peerList.length + ' online';

  if (peerList.length === 0) {
    peerListEl.innerHTML = '<div style="padding:16px 8px;text-align:center;color:var(--tx2);font-size:12px">Scanning for devices on Wi-Fi...</div>';
    if (!activePeerId) {
      chatPeerNameEl.textContent = 'No device selected';
      chatPeerStatusEl.textContent = 'Waiting for nearby devices';
      composeInput.placeholder = 'Select a device to message...';
      msgContainerEl.innerHTML = '';
    }
    return;
  }

  if (!activePeerId && peerList.length > 0) {
    selectPeer(peerList[0].device_id);
  }

  var html = '';
  peerList.forEach(function(peer) {
    var style = getDeviceStyle(peer.device_type);
    var isActive = peer.device_id === activePeerId ? ' active' : '';
    var unread = unreadCounts[peer.device_id] || 0;
    var badgeHtml = unread > 0 ? '<span class="badge">' + unread + '</span>' : '';

    html += '<div class="row' + isActive + '" data-id="' + peer.device_id + '">' +
      '<div class="av" style="background:' + style.bg + '"><i class="' + style.icon + '" style="font-size:20px" aria-hidden="true"></i></div>' +
      '<div class="grow"><p class="name">' + escapeHtml(peer.alias) + '</p><p class="sub">' + style.label + ' (' + peer.ip + ')</p></div>' +
      badgeHtml +
    '</div>';
  });

  peerListEl.innerHTML = html;

  var rows = peerListEl.querySelectorAll('.row');
  rows.forEach(function(row) {
    row.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      selectPeer(id);
    });
  });
}

function selectPeer(peerId) {
  activePeerId = peerId;
  var peer = peersMap[peerId];
  if (!peer) return;

  var style = getDeviceStyle(peer.device_type);
  chatAvEl.style.background = style.bg;
  chatIconEl.className = style.icon;
  chatPeerNameEl.textContent = peer.alias;
  chatPeerStatusEl.textContent = 'Online on this Wi-Fi';
  composeInput.placeholder = 'Message ' + peer.alias;

  unreadCounts[peerId] = 0;
  renderPeerList();

  if (window.__TAURI__ && window.__TAURI__.core) {
    window.__TAURI__.core.invoke('mark_thread_read', { peerId: peerId }).catch(console.error);
    loadChatHistory(peerId);
  }
}

function renderMessage(msg) {
  var div = document.createElement('div');
  if (msg.is_incoming) {
    div.className = 'in-b';
    div.innerHTML = '<p class="who">' + escapeHtml(msg.sender_name) + '</p><div class="bub-in">' + escapeHtml(msg.content) + '</div>';
  } else {
    div.className = 'out-b';
    div.id = 'msg-' + msg.id;
    var myName = mySettings ? mySettings.alias : 'You';
    div.innerHTML = '<p class="who">You (' + escapeHtml(myName) + ')</p><div class="bub-out">' + escapeHtml(msg.content) + '</div><p class="status">' + escapeHtml(msg.status) + '</p>';
  }
  return div;
}

function renderFileCard(t) {
  var card = document.getElementById('transfer-' + t.transfer_id);
  if (!card) {
    card = document.createElement('div');
    card.className = 'file';
    card.id = 'transfer-' + t.transfer_id;
    msgContainerEl.appendChild(card);
  }

  var iconClass = getFileIcon(t.file_name);
  var pct = t.file_size > 0 ? Math.min(100, Math.round((t.transferred_bytes / t.file_size) * 100)) : 0;
  var speedText = t.speed_mbps > 0 ? t.speed_mbps.toFixed(1) + ' MB/s' : '';
  var subInfo = escapeHtml(t.sender_name) + ' to ' + escapeHtml(t.receiver_name) + ', ' + formatBytes(t.file_size);
  if (speedText) subInfo += ', ' + speedText;

  var statusText = '';
  var actionButtonsHtml = '';

  if (t.status === 'Pending') {
    if (t.is_incoming) {
      statusText = 'Incoming file offer';
      actionButtonsHtml = '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="modal-btn btn-accept" data-id="' + t.transfer_id + '" style="padding:4px 14px;font-size:12px">Accept</button>' +
        '<button class="modal-btn btn-decline" data-id="' + t.transfer_id + '" style="padding:4px 14px;font-size:12px;background:var(--in);color:var(--tx)">Decline</button>' +
      '</div>';
    } else {
      statusText = 'Waiting for receiver to accept...';
    }
  } else if (t.status === 'Accepted') {
    statusText = 'Accepted, preparing transfer...';
    if (!t.is_incoming) {
      // Sender starts upload
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('start_file_upload', { transferId: t.transfer_id }).catch(console.error);
      }
    }
  } else if (t.status === 'Declined') {
    statusText = 'Transfer declined';
  } else if (t.status === 'Transferring') {
    var remainingBytes = t.file_size - t.transferred_bytes;
    var secondsLeft = t.speed_mbps > 0 ? Math.ceil((remainingBytes / (1024 * 1024)) / t.speed_mbps) : 0;
    var timeLeftText = secondsLeft > 0 ? ', about ' + secondsLeft + ' s left' : '';
    statusText = pct + '%' + timeLeftText;
  } else if (t.status === 'Completed') {
    statusText = '100%, Completed';
  } else if (t.status === 'Cancelled') {
    statusText = 'Transfer cancelled';
  } else if (typeof t.status === 'object' && t.status.Failed) {
    statusText = 'Failed: ' + t.status.Failed;
  }

  var cancelIconHtml = (t.status === 'Transferring' || t.status === 'Pending') ?
    '<i class="ti ti-x ico btn-cancel" data-id="' + t.transfer_id + '" aria-label="Cancel" style="cursor:pointer"></i>' : '';

  card.innerHTML = '<div class="file-top">' +
    '<div class="av" style="background:var(--c-file)"><i class="' + iconClass + '" style="font-size:20px" aria-hidden="true"></i></div>' +
    '<div class="grow"><p class="name">' + escapeHtml(t.file_name) + '</p><p class="sub">' + subInfo + '</p></div>' +
    cancelIconHtml +
  '</div>' +
  '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
  '<p class="sub" style="margin-top:6px">' + statusText + '</p>' +
  actionButtonsHtml;

  // Event handlers for accept/decline/cancel
  var btnAccept = card.querySelector('.btn-accept');
  if (btnAccept) {
    btnAccept.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('respond_file_transfer', { transferId: id, accepted: true }).catch(console.error);
      }
    });
  }

  var btnDecline = card.querySelector('.btn-decline');
  if (btnDecline) {
    btnDecline.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('respond_file_transfer', { transferId: id, accepted: false }).catch(console.error);
      }
    });
  }

  var btnCancel = card.querySelector('.btn-cancel');
  if (btnCancel) {
    btnCancel.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('cancel_file_transfer', { transferId: id }).catch(console.error);
      }
    });
  }

  msgContainerEl.scrollTop = msgContainerEl.scrollHeight;
}

function loadChatHistory(peerId) {
  if (!window.__TAURI__ || !window.__TAURI__.core) return;
  window.__TAURI__.core.invoke('get_chat_history', { peerId: peerId }).then(function(messages) {
    msgContainerEl.innerHTML = '';
    if (messages.length === 0) {
      var peer = peersMap[peerId];
      var name = peer ? peer.alias : 'device';
      msgContainerEl.innerHTML = '<div style="margin:auto;text-align:center;color:var(--tx2);font-size:13px"><p>No messages yet with ' + escapeHtml(name) + '</p><p class="sub" style="margin-top:4px">Send a message or file to start chatting</p></div>';
      return;
    }
    messages.forEach(function(m) {
      msgContainerEl.appendChild(renderMessage(m));
    });
    // Also re-render any active transfers for this peer
    Object.values(activeTransfers).forEach(function(t) {
      if (t.peer_id === peerId) {
        renderFileCard(t);
      }
    });
    msgContainerEl.scrollTop = msgContainerEl.scrollHeight;
  }).catch(console.error);
}

function sendMessage() {
  var text = composeInput.value.trim();
  if (!text || !activePeerId) return;

  composeInput.value = '';

  if (window.__TAURI__ && window.__TAURI__.core) {
    window.__TAURI__.core.invoke('send_chat_message', {
      peerId: activePeerId,
      content: text
    }).then(function(sentMsg) {
      var existing = document.getElementById('msg-' + sentMsg.id);
      if (existing) {
        var statusEl = existing.querySelector('.status');
        if (statusEl) statusEl.textContent = sentMsg.status;
      } else {
        msgContainerEl.appendChild(renderMessage(sentMsg));
        msgContainerEl.scrollTop = msgContainerEl.scrollHeight;
      }
    }).catch(function(err) {
      console.error('Send error:', err);
    });
  }
}

composeInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
btnSend.addEventListener('click', sendMessage);

// File attachment
if (btnAttach) {
  btnAttach.addEventListener('click', function() {
    if (!activePeerId) return;
    if (window.__TAURI__ && window.__TAURI__.core) {
      window.__TAURI__.core.invoke('pick_file_to_send').then(function(path) {
        if (path) {
          window.__TAURI__.core.invoke('send_file_request', {
            peerId: activePeerId,
            filePath: path
          }).then(function(info) {
            activeTransfers[info.transfer_id] = info;
            renderFileCard(info);
          }).catch(console.error);
        }
      }).catch(console.error);
    }
  });
}

// Drag and Drop
document.addEventListener('dragover', function(e) {
  e.preventDefault();
  e.stopPropagation();
});
document.addEventListener('drop', function(e) {
  e.preventDefault();
  e.stopPropagation();
});

// Settings Modal interactions
if (btnSettings) {
  btnSettings.addEventListener('click', function() {
    if (mySettings) {
      aliasInput.value = mySettings.alias || '';
      deviceIdEl.textContent = mySettings.device_id || '';
      portEl.textContent = mySettings.port ? String(mySettings.port) : '53317';
    }
    settingsModal.classList.add('show');
  });
}
if (closeSettings) {
  closeSettings.addEventListener('click', function() {
    settingsModal.classList.remove('show');
  });
}
if (btnSaveSettings) {
  btnSaveSettings.addEventListener('click', function() {
    var newAlias = aliasInput.value.trim();
    if (!newAlias) return;
    if (window.__TAURI__ && window.__TAURI__.core) {
      window.__TAURI__.core.invoke('update_alias', { alias: newAlias }).then(function(updated) {
        updateMyDeviceUI(updated);
        settingsModal.classList.remove('show');
      }).catch(console.error);
    }
  });
}

// Initial Tauri setup
if (window.__TAURI__ && window.__TAURI__.core) {
  window.__TAURI__.core.invoke('get_device_info').then(function(info) {
    updateMyDeviceUI(info);
  }).catch(console.error);

  window.__TAURI__.core.invoke('get_nearby_devices').then(function(devices) {
    devices.forEach(function(d) { peersMap[d.device_id] = d; });
    renderPeerList();
  }).catch(console.error);

  window.__TAURI__.core.invoke('get_unread_badges').then(function(badges) {
    unreadCounts = badges || {};
    renderPeerList();
  }).catch(console.error);

  if (window.__TAURI__.event) {
    window.__TAURI__.event.listen('nearby_devices_changed', function(event) {
      var devices = event.payload || [];
      var newMap = {};
      devices.forEach(function(d) { newMap[d.device_id] = d; });
      peersMap = newMap;

      if (activePeerId && !peersMap[activePeerId]) {
        var remaining = Object.keys(peersMap);
        if (remaining.length > 0) {
          selectPeer(remaining[0]);
        } else {
          activePeerId = null;
        }
      }
      renderPeerList();
    });

    window.__TAURI__.event.listen('new_message', function(event) {
      var msg = event.payload;
      if (!msg) return;

      if (msg.thread_peer_id === activePeerId) {
        msgContainerEl.appendChild(renderMessage(msg));
        msgContainerEl.scrollTop = msgContainerEl.scrollHeight;
        window.__TAURI__.core.invoke('mark_thread_read', { peerId: activePeerId }).catch(console.error);
      } else {
        unreadCounts[msg.thread_peer_id] = (unreadCounts[msg.thread_peer_id] || 0) + 1;
        renderPeerList();
      }
    });

    window.__TAURI__.event.listen('message_status_updated', function(event) {
      var msg = event.payload;
      if (!msg) return;
      var el = document.getElementById('msg-' + msg.id);
      if (el) {
        var statusEl = el.querySelector('.status');
        if (statusEl) statusEl.textContent = msg.status;
      }
    });

    // File transfer progress updates
    window.__TAURI__.event.listen('file_transfer_progress', function(event) {
      var info = event.payload;
      if (!info) return;
      activeTransfers[info.transfer_id] = info;
      if (info.peer_id === activePeerId) {
        renderFileCard(info);
      }
    });
  }
}
</script>
</body>
</html>
